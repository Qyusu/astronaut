[project]
name = "astronaut-private"
version = "0.1.0"
description = "[PRIVATE] 'Astronaut' is an Agentic System that autonomously generates ideas and executable programs for quantum feature maps, and iteratively refines them through self-directed improvements."
authors = [
    { name = "kenya-sk" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11.7,<3.12"
dependencies = [
    "openai==1.102.0",
    "pennylane==0.39.0",
    "qxmt==0.5.10",
    "pydantic>=2.9.2,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "loguru>=0.7.2,<1.0.0",
    "click>=8.1.7,<9.0.0",
    "pinecone==7.0.2",
    "tiktoken>=0.8.0,<1.0.0",
    "pennylane-lightning==0.39.0",
    "langsmith>=0.2.1,<1.0.0",
    "pdfplumber==0.11.4",
    "amazon-braket-pennylane-plugin>=1.31.2,<2.0.0",
    "google-genai>=1.3.0,<2.0.0",
    "anthropic>=0.49.0,<1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3,<9.0.0",
    "isort>=5.13.2,<6.0.0",
    "mypy>=1.13.0,<2.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "ipykernel>=6.29.5,<7.0.0",
    "pytest-mock>=3.14.0,<4.0.0",
    "ruff>=0.11.13",
]
gpu = [
    "custatevec-cu12",
    "pennylane-lightning-gpu==0.39.0",
]

[project.urls]
Repository = "https://github.com/kenya-sk/astronaut-private"

[tool.setuptools]
packages = ["astronaut"]

[tool.ruff]
line-length = 80
target-version = "py311"

include = ["astronaut/**/*.py", "tests/**/*.py", "*.py"]
exclude = [
    ".git",
    ".venv",
    ".vscode",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "build",
    "dist",
    "*.egg-info",
    "experiments",
    "logs",
    "data",
    "notebooks",
    "docs",
    "configs",
    "astronaut/generated",
    "astronaut/llm/cost.py",
]

[tool.ruff.lint]
select = ["E", "F"]
ignore = [
    "E203",
    "E302",
    "E305",
    "E501",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
